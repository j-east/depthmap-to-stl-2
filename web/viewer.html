<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terrain Maps — board</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#0d1015;color:#e7e7ef;font:15px -apple-system,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  header{padding:12px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #1e2230}
  .back{color:#9aa;font-size:14px} .title{flex:1} .title h1{margin:0;font-size:17px} .title .p{color:#7a829a;font-size:13px}
  .btn{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer}
  .btn.ghost{background:#1c2230;border:1px solid #2a3040} .btn:disabled{background:#33415a}
  .vote{display:flex;align-items:center;gap:6px;background:#1a1f2b;border:1px solid #2a3142;border-radius:9px;padding:8px 13px;cursor:pointer}
  .vote.voted{background:#23314e;border-color:#2563eb}
  #view{flex:1;position:relative} #c{width:100%;height:100%;display:block}
  #status{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:13px;color:#9fd;background:#0d1015cc;padding:5px 12px;border-radius:8px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #3a3a52;border-top-color:#7dd3fc;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<header>
  <a class="back" href="/">← Gallery</a>
  <div class="title"><h1 id="name">…</h1><div class="p" id="place"></div></div>
  <span class="vote" id="vote" onclick="vote()">▲ <b id="votes">0</b></span>
  <button class="btn ghost" id="remix">✎ Remix</button>
  <button class="btn ghost" id="dl">⬇ Download 3MF</button>
  <button class="btn" id="order">Order print</button>
</header>
<div id="view"><canvas id="c"></canvas><div id="status" style="display:none"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const ID=new URLSearchParams(location.search).get('design');
let VOTER=localStorage.getItem('voter'); if(!VOTER){VOTER=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('voter',VOTER);}
const VOTED=new Set(JSON.parse(localStorage.getItem('voted')||'[]'));
let design=null;
const st=(h,c)=>{const s=document.getElementById('status');if(!h){s.style.display='none';return;}s.style.display='block';s.innerHTML=h;s.style.color=c||'#9fd';};

// ---- free-account gate for downloads (name + email -> /api/signup) ----
function getAccount(){ try{return JSON.parse(localStorage.getItem('tmAccount')||'null');}catch(e){return null;} }
let acctThen=null, gisMounted=false;
async function mountGoogle(){          // Sign in with Google, when GOOGLE_CLIENT_ID is configured
  if(gisMounted) return;
  try{
    const cfg=await (await fetch('/api/config')).json();
    if(!cfg.googleClientId) return;
    if(!(window.google&&google.accounts)) await new Promise((res,rej)=>{ const s=document.createElement('script');
      s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    google.accounts.id.initialize({client_id:cfg.googleClientId, callback:async resp=>{
      try{ const r=await (await fetch('/api/signup',{method:'POST',body:JSON.stringify({credential:resp.credential})})).json();
        if(!r.id) throw new Error(r.error||'google sign-in failed');
        localStorage.setItem('tmAccount',JSON.stringify({id:r.id,email:r.email||'',handle:r.handle||''}));
        document.getElementById('acctOv').style.display='none'; if(acctThen)acctThen();
      }catch(e){ document.getElementById('acctErr').textContent=e.message; } }});
    google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_black',size:'large',width:280});
    document.getElementById('gdiv').style.display='block';
    gisMounted=true;
  }catch(e){}
}
function askAccount(then){
  if(getAccount()){then();return;}
  acctThen=then;
  let ov=document.getElementById('acctOv');
  if(!ov){ ov=document.createElement('div'); ov.id='acctOv';
    ov.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50';
    ov.innerHTML=`<div style="background:#161b26;border:1px solid #2a3142;border-radius:14px;padding:22px;width:330px;font-size:14px">
      <h3 style="margin:0 0 6px">Create a free account</h3>
      <div style="color:#8a94ad;font-size:13px;margin-bottom:12px">It's free — sign in to download and publish.</div>
      <div id="gbtn" style="display:flex;justify-content:center"></div>
      <div id="gdiv" style="display:none;text-align:center;color:#5d6579;font-size:12px;margin:8px 0">— or with email —</div>
      <input id="acctName" placeholder="name / handle" style="width:100%;margin-bottom:8px;background:#22222e;color:#eee;border:1px solid #3a3a52;border-radius:6px;padding:8px">
      <input id="acctEmail" placeholder="email" type="email" style="width:100%;margin-bottom:12px;background:#22222e;color:#eee;border:1px solid #3a3a52;border-radius:6px;padding:8px">
      <div style="display:flex;gap:8px">
        <button id="acctGo" style="flex:1;background:#1f7a3a;color:#fff;border:0;border-radius:7px;padding:9px;cursor:pointer">Create account</button>
        <button id="acctNo" style="background:#2a3142;color:#cdd;border:0;border-radius:7px;padding:9px 12px;cursor:pointer">Cancel</button>
      </div>
      <div id="acctErr" style="color:#ff8a8a;font-size:12px;margin-top:8px;min-height:15px"></div></div>`;
    document.body.appendChild(ov); }
  ov.style.display='flex'; mountGoogle();
  document.getElementById('acctNo').onclick=()=>ov.style.display='none';
  document.getElementById('acctGo').onclick=async()=>{
    const handle=document.getElementById('acctName').value.trim(), email=document.getElementById('acctEmail').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ document.getElementById('acctErr').textContent='enter a valid email'; return; }
    try{ const r=await (await fetch('/api/signup',{method:'POST',body:JSON.stringify({email,handle})})).json();
      if(!r.id) throw new Error(r.error||'signup failed');
      localStorage.setItem('tmAccount',JSON.stringify({id:r.id,email,handle:r.handle||handle}));
      ov.style.display='none'; if(acctThen)acctThen();
    }catch(e){ document.getElementById('acctErr').textContent=e.message; } };
}
let renderer,scene,camera,controls,group;
function initView(){
  const cv=document.getElementById('c'), el=cv.parentElement;
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.setSize(el.clientWidth,el.clientHeight);
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0d1015);
  camera=new THREE.PerspectiveCamera(42,el.clientWidth/el.clientHeight,0.1,5000); camera.up.set(0,0,1); camera.position.set(142,-270,210);
  controls=new THREE.OrbitControls(camera,cv); controls.enableDamping=true; controls.autoRotate=true; controls.autoRotateSpeed=1.0;
  controls.enableZoom=false;
  cv.addEventListener('wheel',e=>{ e.preventDefault();       // two-finger pan / pinch zoom
    if(e.ctrlKey){ const f=Math.exp(e.deltaY*0.004);
      camera.position.sub(controls.target).multiplyScalar(f).add(controls.target); }
    else{ const dist=camera.position.distanceTo(controls.target);
      const scale=2*dist*Math.tan(camera.fov*Math.PI/360)/cv.clientHeight;
      const move=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0).multiplyScalar(e.deltaX*scale)
        .add(new THREE.Vector3().setFromMatrixColumn(camera.matrix,1).multiplyScalar(-e.deltaY*scale));
      camera.position.add(move); controls.target.add(move); }
  },{passive:false});
  scene.add(new THREE.HemisphereLight(0xffffff,0x223,0.85)); const d=new THREE.DirectionalLight(0xffffff,0.7); d.position.set(-1,-1,2); scene.add(d);
  addEventListener('resize',()=>{renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();});
  cv.addEventListener('pointerdown',()=>controls.autoRotate=false);
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
}
function unpackMesh(buf){
  const dv=new DataView(buf),hlen=dv.getUint32(0,true);
  const header=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,hlen)));
  let off=4+hlen; return header.objects.map(o=>{const v=buf.slice(off,off+o.v);off+=o.v;const t=buf.slice(off,off+o.t);off+=o.t;return{color:o.color,verts:v,tris:t};});
}
function showMesh(objs){
  const g=new THREE.Group();
  objs.forEach(o=>{const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(o.verts),3));
    geo.setIndex(new THREE.BufferAttribute(new Uint32Array(o.tris),1)); geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:new THREE.Color(o.color),roughness:0.92,side:THREE.DoubleSide})));});
  const box=new THREE.Box3().setFromObject(g),c=box.getCenter(new THREE.Vector3()); g.position.set(-c.x,-c.y,-c.z);
  if(group)scene.remove(group); group=g; scene.add(g);
}
async function load(){
  initView();
  try{
    design=await (await fetch('/api/designs/'+ID)).json();
    document.getElementById('name').textContent=design.name;
    document.getElementById('place').textContent=design.place||'';
    document.getElementById('votes').textContent=design.votes;
    if(VOTED.has(ID)) document.getElementById('vote').classList.add('voted');
    document.getElementById('remix').onclick=()=>location='/designer?design='+ID;
    document.getElementById('order').onclick=()=>location='/order?design='+ID;
    document.getElementById('dl').onclick=()=>askAccount(download);
    if(design.mesh){ showMesh(unpackMesh(await (await fetch('/mesh-design/'+ID)).arrayBuffer())); }   // instant
    else st('no preview mesh — try Remix to rebuild','#ffb86b');
    if(new URLSearchParams(location.search).get('dl')) askAccount(download);   // hero's Download button
  }catch(e){ st('could not load board: '+e.message,'#ff8a8a'); }
}
async function vote(){
  if(!ID||VOTED.has(ID)) return;
  try{ const r=await (await fetch('/api/designs/'+ID+'/vote',{method:'POST',body:JSON.stringify({voter:VOTER})})).json();
    document.getElementById('votes').textContent=r.votes; document.getElementById('vote').classList.add('voted');
    VOTED.add(ID); localStorage.setItem('voted',JSON.stringify([...VOTED])); }catch(e){}
}
// Download lazily spins up Pyodide (only when explicitly requested) and rebuilds the print-res 3MF
let worker=null, workerReadyOnce=false, pendingFire=null;
function ensureWorker(){
  if(worker) return;
  worker=new Worker('worker.js');
  worker.onmessage=(ev)=>{ const m=ev.data;
    if(m.type==='ready'){ workerReadyOnce=true; if(pendingFire){pendingFire();pendingFire=null;} }
    else if(m.type==='progress') st('<span class="spin"></span>'+m.msg);
    else if(m.type==='error'){ st('failed: '+m.msg,'#ff8a8a'); document.getElementById('dl').disabled=false; }
    else if(m.type==='done'){
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([m.tmf],{type:'model/3mf'}));
      a.download=(design.name||'board')+'.3mf'; a.click();
      st('✓ downloaded','#7CFC9A'); document.getElementById('dl').disabled=false; setTimeout(()=>st(''),2500);
    }};
}
function download(){
  if(!design) return;
  document.getElementById('dl').disabled=true; st('<span class="spin"></span>preparing 3MF (first time loads the engine)…');
  ensureWorker();
  const fire=()=>{ const p=design.params||{};
    const msg={type:'generate',bbox:design.bbox,exag:p.exag||4};
    if(p.hide) msg.hide=p.hide;
    if(p.holes) msg.holes=p.holes;     // the creator's edited hole labels, strays excluded
    if(p.title) msg.title=p.title; if(p.subtitle) msg.subtitle=p.subtitle;
    if(p.pitch) msg.pitch=p.pitch; if(p.plaquePos) msg.plaquePos=p.plaquePos;
    if(p.baseH) msg.baseH=p.baseH;
    ['heights','outlineBlob','corridorW','outlineH','numSize','numH','numFlat','plaqueSize','cropShape','organicPad','outlineMode','satScan']
      .forEach(k=>{ if(p[k]!=null) msg[k]=p[k]; });
    if(p.route){ msg.route=p.route; msg.kind=p.kind||design.type; msg.holes=[]; if(p.routeW) msg.routeW=p.routeW; if(p.routeH) msg.routeH=p.routeH; }
    worker.postMessage(msg); };
  if(workerReadyOnce) fire(); else pendingFire=fire;
}
load();
</script></body></html>
